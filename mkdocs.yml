site_name: nilam
site_description: Proven colour. A design system whose palette is solved from contrast requirements and verified under three kinds of colour blindness.
site_url: https://jvoltci.github.io/nilam/
repo_url: https://github.com/jvoltci/nilam
repo_name: jvoltci/nilam
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  language: en

  # `primary: custom` and `accent: custom` match none of material's built-in colour
  # blocks, so material declares no primary/accent variables at all and
  # docs/stylesheets/extra.css declares them from nilam's solved tokens instead.
  # Picking `indigo` and calling it close enough would mean this site is painted in
  # material's indigo while claiming every colour on it was solved.
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

  # `font: false` disables mkdocs-material's Google Fonts request. nilam's --font-sans
  # is `system-ui, -apple-system, …` and it ships no font files, so fetching Roboto
  # from a CDN to render a page that documents a system-font stack would contradict the
  # page. extra.css points --md-text-font-family at --font-sans instead.
  font: false

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  # Required. Every live example on this site is real HTML inside a markdown file, and
  # without md_in_html a block of markup indented next to prose is escaped and printed
  # rather than rendered.
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

# The shipped stylesheets, the hero art, the behaviours module and the demo page are
# all OUTSIDE docs_dir — they belong to the package, not to the docs. The hook adds
# them to the build rather than copying them into docs/, so there is no second copy of
# a generated file to go stale.
hooks:
  - hooks/nilam_assets.py

# --strict alone does NOT check anchors — only whether the target FILE exists. So
# `palette.md#step-9` and `palette.md#no-such-heading` would be equally acceptable, and
# these pages cross-link into each other's headings a couple of dozen times. Renaming
# one heading would silently break every link into it. `anchors: warn` plus --strict
# turns that into a build failure.
validation:
  anchors: warn
  unrecognized_links: warn

nav:
  - Start here:
      - Overview: index.md
      - Why solved colour: solved.md
      - Colour blindness: colour-blindness.md
  - The palette:
      - Tokens: palette.md
      - Platform export: tokens.md
  - Build with it:
      - Components: components.md
      - Behaviours: behaviours.md
      - Tailwind and shadcn: tailwind.md
  - Honest limits:
      - Limitations: limitations.md
      - Visual regression: visual.md
  - Learn:
      - Where to start: learn/index.md
      - 1 · Why a design system: learn/1-what-is-a-design-system.md
      - 2 · Why hex is a trap: learn/2-hex-is-a-trap.md
      - 3 · What 4.5:1 means: learn/3-contrast.md
      - 4 · Why twelve steps: learn/4-twelve-steps.md
      - 5 · Dark mode: learn/5-dark-mode.md
      - 6 · Shadows: learn/6-shadows.md
      - 7 · Colour blindness: learn/7-colour-blindness.md
      - 8 · Type and space: learn/8-type-and-space.md
      - 9 · The cascade: learn/9-the-cascade.md
      - 10 · The platform: learn/10-the-platform.md
      - 11 · Tokens beyond CSS: learn/11-tokens-beyond-css.md
      - 12 · How you know: learn/12-how-you-know.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jvoltci/nilam
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/nilam

# ORDER IS LOAD-BEARING. nilam.tokens.css opens with
# `@layer nilam.tokens, nilam.base, nilam.components, nilam.utilities;`, and that one
# statement is what fixes the layer order for every file after it. Loading
# components.css first would create the `nilam.components` layer earlier than
# `nilam.tokens` and invert the cascade.
#
# nilam.base.css is deliberately NOT in this list. extra.css says why.
extra_css:
  - nilam.tokens.css
  - nilam.scale.css
  - nilam.components.css
  - nilam.widgets.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/demo.js
